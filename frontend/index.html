<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="O-Brain — AI-powered business management suite" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="O-Brain" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>O-Brain</title>
    <script>
      // Applied before first paint so the app doesn't flash light before
      // React mounts and useUiStore hydrates — dark is the default theme.
      (function () {
        var stored = localStorage.getItem('theme')
        if (stored !== 'light') document.documentElement.classList.add('dark')
        // Same pre-paint trick for language so <html lang> is right before
        // i18next boots (Bill 96 audits and screen readers both read it).
        var locale = localStorage.getItem('locale')
        if (locale === 'fr-CA') document.documentElement.lang = 'fr-CA'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
