name: Security Scan

# Dependency / filesystem vulnerability scanning. Runs on every push + PR, and
# weekly (Mondays 06:00 UTC) to catch newly-disclosed CVEs in unchanged deps.
#
# GATING POLICY — backend and frontend are deliberately DECOUPLED by path:
#   * BACKEND (backend/**, incl. the pinned requirements.txt) is clean as of the
#     starlette/fastapi + 12-package patch (one documented allowlist entry), so
#     its scans BLOCK. This is the guard against a regression sneaking back in.
#   * FRONTEND (frontend/**) still has a backlog of ~81 transitive dev/build
#     tooling findings, so its scans REPORT ONLY (continue-on-error). A gate
#     that's red on day one gets ignored — same rationale as the eslint gate in
#     ci.yml. Remove continue-on-error from the frontend jobs once that backlog
#     is cleared.
# The two used to share a single repo-wide Trivy scan, which is the only reason
# a frontend finding could block a backend-clean build.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # required to upload SARIF to GitHub code scanning

jobs:
  # ---- BACKEND: Trivy scoped to backend/ — BLOCKING -------------------------
  trivy-backend:
    name: Trivy (backend) [blocking]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scan-ref: backend/ — path-scoped so frontend findings can never fail
      # this job. Writes SARIF and exits non-zero on HIGH/CRITICAL (respecting
      # the .trivyignore allowlist). NO continue-on-error: this gate blocks.
      # Run Trivy from its official pinned image rather than the marketplace
      # action: aquasecurity/trivy-action's bundled install.sh fails on the
      # runner (exit 1 immediately after resolving the release), which showed up
      # as a red BLOCKING gate that was a tooling failure, not a finding.
      # Docker is preinstalled on ubuntu-latest, so this has no install step.
      - name: Trivy scan (backend)
        run: |
          # First pass: human-readable table to the job log so findings are
          # visible in CI (SARIF goes to a file and would otherwise be silent).
          # Does not gate — the second pass does.
          docker run --rm -v "$PWD:/repo" -w /repo \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e TRIVY_CACHE_DIR=/tmp/trivy-cache \
            aquasec/trivy:0.65.0 fs backend \
            --scanners vuln --severity HIGH,CRITICAL \
            --ignorefile .trivyignore --format table
          # Second pass: SARIF for code scanning + the blocking exit code.
          # DB is cached from the first pass, so this is fast.
          docker run --rm -v "$PWD:/repo" -w /repo \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e TRIVY_CACHE_DIR=/tmp/trivy-cache \
            aquasec/trivy:0.65.0 fs backend \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile .trivyignore \
            --format sarif --output trivy-backend.sarif

      # Runs even when the scan above fails the job, so findings still reach the
      # Security tab. Soft-fail: SARIF upload needs a public repo or GHAS.
      - name: Upload SARIF (backend)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  # ---- BACKEND: pip-audit on the pinned lockfile — BLOCKING -----------------
  pip-audit:
    name: pip-audit (backend) [blocking]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.10 matches the production venv the pinned lockfile was frozen from,
          # so pip-audit can resolve every pin (some are 3.10-only, e.g.
          # backports.asyncio.runner). Trivy also scans requirements.txt statically.
          python-version: "3.10"
      - run: pip install pip-audit
      - name: Audit pinned backend dependencies
        # BLOCKING. To accept an advisory, append `--ignore-vuln <GHSA/CVE id>`
        # here with a justification in SECURITY_MAINTENANCE.md.
        #
        # PYSEC-2026-1325 (ecdsa, Minerva timing attack on P-256): NO FIX EXISTS
        # — upstream considers side-channel attacks out of scope. Not reachable
        # for us: `ecdsa` is a transitive dep of python-jose only, and we sign
        # JWTs with HS256 (symmetric HMAC, app/config.py) — the affected
        # ecdsa.SigningKey.sign_digest()/P-256 path is never called.
        # Accepted 2026-07-26; re-review 2026-10-26. See SECURITY_MAINTENANCE.md.
        run: |
          pip-audit --requirement backend/requirements.txt --desc \
            --ignore-vuln PYSEC-2026-1325

  # ---- FRONTEND: Trivy scoped to frontend/ — REPORT ONLY --------------------
  trivy-frontend:
    name: Trivy (frontend) [report-only]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan (frontend)
        continue-on-error: true # report-only: pre-existing dev/build-tool backlog
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e TRIVY_CACHE_DIR=/tmp/trivy-cache \
            aquasec/trivy:0.65.0 fs frontend \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile .trivyignore \
            --format sarif --output trivy-frontend.sarif
      - name: Upload SARIF (frontend)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # ---- FRONTEND: pnpm audit — REPORT ONLY -----------------------------------
  npm-audit:
    name: Frontend audit (pnpm) [report-only]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # Frontend uses pnpm (see deploy.sh), so `pnpm audit` reads pnpm-lock.yaml.
      - name: pnpm audit (frontend)
        # report-only: remove continue-on-error once the transitive dev/build
        # tooling backlog is cleared.
        continue-on-error: true
        working-directory: frontend
        run: pnpm audit --audit-level high
